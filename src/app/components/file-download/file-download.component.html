<p-toast />
<!-- اضافه کردن dir="rtl" برای راست‌چین شدن کل کانتینر -->
<div class="flex flex-col gap-3" dir="rtl">
  <div class="flex gap-2 justify-start">
    <p-button
      label="انتخاب پوشه"
      icon="pi pi-folder-open"
      severity="secondary"
      [outlined]="true"
      (onClick)="selectDirectory()"
    />
    <p-button
      label="دانلود فایل"
      icon="pi pi-download"
      [loading]="isDownloading()"
      (onClick)="downloadFile()"
    />
  </div>

  @if (directoryHandle()) {
    <small class="text-green-600 text-right">
      <i class="pi pi-check-circle ml-1"></i>
      پوشه مقصد: <strong>{{ directoryHandle().name }}</strong>
    </small>
  } @else {
    <small class="text-gray-500 text-right">
      هنوز پوشه‌ای انتخاب نشده است. دکمه دانلود برای دریافت پوشه از شما سوال می‌پرسد.
    </small>
  }
</div>
